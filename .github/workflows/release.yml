name: build-and-release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-portable:
    runs-on: windows-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Provide bundled node.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop-native/node | Out-Null
          $node = (Get-Command node).Source
          Copy-Item $node desktop-native/node/node.exe -Force
          dotnet --list-runtimes

      - name: Build portable app
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-native.ps1

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build-installer.ps1

      - name: Package portable zip
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/WowoPet-Windows-Portable/*" -DestinationPath "WowoPet-Windows-Portable-v1.7.0.zip" -CompressionLevel Optimal
          Get-Item "WowoPet-Windows-Portable-v1.7.0.zip", "dist/WowoPet-Setup-1.7.0.exe" | Select-Object Name, Length

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-package
          path: |
            WowoPet-Windows-Portable-v1.7.0.zip
            dist/WowoPet-Setup-1.7.0.exe
          retention-days: 7

  release:
    needs: windows-portable
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: windows-package
          path: release-assets

      - name: List assets
        run: find release-assets -type f -printf '%p %s\n' | sort

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete v1.7.0 --yes 2>/dev/null || true
          gh release create v1.7.0 android/release/WowoPet-Android-1.7.0.apk \
            --title "喔喔桌宠 v1.7.0" \
            --notes "1.7.0：新增密友投喂、双人出游/双人运动申请与 30 分钟固定活动；申请支持取消/拒绝，主页增加不阻塞操作的好友通知条；新增双人动态文案与好友手帐记录；包含此前台灯、梦话、睡眠和手帐修复。Windows 安装版、便携版、独立 Android APK。" \
            --verify-tag --draft

      - name: Upload Windows setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SETUP=$(find release-assets -name 'WowoPet-Setup-1.7.0.exe' -print -quit)
          echo "setup=$SETUP"
          gh release upload v1.7.0 "$SETUP" --clobber

      - name: Upload portable zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ZIP=$(find release-assets -name 'WowoPet-Windows-Portable-v1.7.0.zip' -print -quit)
          echo "zip=$ZIP"
          gh release upload v1.7.0 "$ZIP" --clobber

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit v1.7.0 --draft=false
