<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fbf6ee">
  <title>密友手帐 · 喔喔</title>
  <link rel="icon" href="/assets/icon-192.png" type="image/png">
  <link rel="stylesheet" href="/css/theme.css">
  <link rel="stylesheet" href="/css/friend.css">
  <link rel="stylesheet" href="/css/letters.css">
</head>
<body class="friend-page">
  <div class="friend-bg" aria-hidden="true"></div>
  <header class="fb-head">
    <button class="fb-back" id="fbBack" aria-label="返回">←</button>
    <div class="fb-title"><span>密友手帐</span><small>BOND · WOWO</small></div>
    <span class="fb-bond">BOND</span>
  </header>
  <nav class="fb-tabs" id="fbTabs" role="tablist" aria-label="密友页面">
    <button class="fb-tab on" type="button" role="tab" aria-selected="true" data-view="friend">手帐</button>
    <button class="fb-tab" type="button" role="tab" aria-selected="false" data-view="letters">邮局<span class="fb-letter-badge hidden" id="fbLetterBadge"></span></button>
  </nav>
  <main id="friendRoot" class="fb-main" aria-live="polite"></main>
  <div id="fbToast" class="fb-toast" hidden></div>
  <div id="fbModal" class="fb-modal" hidden></div>
  <script src="/shared/content.js"></script>
  <script src="/shared/engine.js"></script>
  <script src="/js/cloud-config.js"></script>
  <script type="module" src="/js/friend-page.js"></script>
</body>
</html>
